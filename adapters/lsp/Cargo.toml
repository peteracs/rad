[package]
name = "rad-lsp"
version = "0.5.0"
edition = "2021"
description = "Language Server Protocol adapter for RAD"
license = "MIT"
repository = "https://github.com/peteracs/rad"
publish = false

[features]
default = ["native-wasm-phase3"]
native-wasm-phase3 = ["rad-vm/native-wasm-phase3"]

[dependencies]
rad-vm = { path = "../../core/vm", default-features = false }
tokio = { version = "1.36.0", features = ["full"] }
tower-lsp = "0.20.0"

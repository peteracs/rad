[workspace]
members = [
    "adapters/cli",
    "adapters/ffi-worker",
    "adapters/lsp",
    "core/relation",
    "core/syntax",
    "core/vm",
    "projects/moba/simcore",
]
resolver = "2"

# One shared `target/` at the repo root instead of per-crate target directories
# (saves duplicate dependencies and confusion).
#
# Dev builds still go to `target/debug` — Cargo has no "off" switch for that.
# To shrink footprint: `cargo clean`, or build with `--release` when you do not
# need fast incremental dev builds.

[profile.dev]
# rad-vm is a large compiler/runtime crate. Retaining its full incremental
# query graph and DWARF state made rustc exceed 1.4 GiB and left multi-GiB
# caches on constrained developer drives. The dedicated `profiling` profile
# below is the symbolized build; ordinary development keeps assertions and
# overflow checks without paying for unused compiler state.
incremental = false
debug = 0
# Strip debug info for dependencies as well.
[profile.dev.package."*"]
debug = 0

# The rad-vm unit-test artifact contains the complete compiler/runtime plus
# more than a thousand tests. Full DWARF for that single executable makes
# rustc retain gigabytes of debuginfo state even though CI and local test runs
# consume test names and diagnostics, not debugger symbols. Keep assertions
# and the normal test harness while emitting no unused symbol payload.
[profile.test]
debug = 0
incremental = false

# opt-level 3 for the native CLI: the interpreter dispatch loop gains
# double-digit percent over "s" (which was chosen for wasm bundle size —
# if playground size regresses, build wasm with --profile wasm-size).
[profile.release]
opt-level = 3
# Thin LTO keeps cross-crate optimization without constructing one
# monolithic LLVM unit for RAD, Wasmtime, and the native adapters. Full LTO
# exhausted developer and CI machines as the compiler/runtime grew.
lto = "thin"

# Runtime optimization work needs an optimized executable after each small
# VM edit, but ThinLTO re-optimizes the complete dependency graph again while
# linking the CLI adapter. This profile keeps release code generation and
# disables only cross-crate LTO; measurements made with it are diagnostic.
# Release claims and acceptance artifacts always use `[profile.release]`.
[profile.runtime-bench]
inherits = "release"
lto = false
codegen-units = 16
# This profile exists only for repeated local VM hot-path measurement. Keep
# optimized code while reusing unchanged codegen units between edits; final
# release evidence still comes from the non-incremental ThinLTO profile above.
incremental = true

[profile.wasm-size]
inherits = "release"
opt-level = "s"

# `samply record` needs symbols; perf characteristics match release.
[profile.profiling]
inherits = "release"
debug = true

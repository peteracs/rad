<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Lane Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(3, 8, 13, 0.86);
      --panel-soft: rgba(5, 12, 18, 0.72);
      --edge: rgba(149, 149, 126, 0.28);
      --gold: #f1b238;
      --blue: #1683ff;
      --green: #22db43;
      --red: #ff4b39;
      --magenta: #f43cff;
      --ink: #06111d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02050a;
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      letter-spacing: 0;
      user-select: none;
    }

    canvas.webgl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette,
    .hud {
      pointer-events: none;
      position: fixed;
      inset: 0;
    }

    .vignette {
      background:
        radial-gradient(circle at 50% 50%, transparent 36%, rgba(0, 7, 16, 0.1) 68%, rgba(0, 0, 0, 0.28) 100%),
        linear-gradient(180deg, rgba(0, 10, 22, 0.18), transparent 17%, transparent 74%, rgba(0, 0, 0, 0.2));
      mix-blend-mode: multiply;
    }

    .hud {
      color: #dce6f1;
      text-shadow: 0 1px 2px #000;
    }

    .panel {
      background: linear-gradient(180deg, rgba(6, 15, 21, 0.94), rgba(2, 7, 10, 0.86));
      border: 1px solid rgba(188, 169, 111, 0.23);
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, 0.75),
        0 0 18px rgba(0, 0, 0, 0.6);
      border-radius: 6px;
    }

    .top-left {
      position: absolute;
      top: 5px;
      left: 5px;
      width: min(330px, calc(100vw - 12px));
      height: 82px;
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      padding: 7px;
    }

    .portrait,
    .hero-card {
      position: relative;
    }

    .portrait {
      width: 28px;
      height: 58px;
      display: grid;
      place-items: start center;
    }

    .portrait::before {
      content: "";
      width: 19px;
      height: 28px;
      margin-top: 3px;
      background: linear-gradient(145deg, #0442dd 0%, #061b8f 46%, #1c71ff 100%);
      clip-path: polygon(50% 0, 100% 36%, 72% 100%, 28% 100%, 0 36%);
      box-shadow: 0 0 14px #005dff;
    }

    .bars {
      display: grid;
      gap: 3px;
      margin-bottom: 5px;
    }

    .bar {
      position: relative;
      height: 12px;
      border: 1px solid #061009;
      background: #07100b;
      overflow: hidden;
    }

    .bar span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 10px;
      line-height: 1;
      color: #e6f6ff;
    }

    .bar.health i,
    .bar.mana i {
      display: block;
      height: 100%;
    }

    .bar.health i {
      width: 100%;
      background: linear-gradient(90deg, #0a7d13, #26d034);
    }

    .bar.mana i {
      width: 100%;
      background: linear-gradient(90deg, #035fae, #16a6ff);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px 7px;
      font-size: 11px;
      color: #d3dee9;
      line-height: 1.15;
    }

    .stat {
      white-space: nowrap;
    }

    .coin-row {
      grid-column: 3;
      color: #ffd26a;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .coin {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 5px;
      vertical-align: -1px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ffe590 0 15%, #f2a51d 18% 70%, #9f5c04 72%);
      box-shadow: 0 0 5px rgba(241, 178, 56, 0.65);
    }

    .score {
      position: absolute;
      top: 0;
      right: 6px;
      width: 125px;
      height: 42px;
      padding: 5px 8px;
      background: linear-gradient(180deg, rgba(5, 10, 17, 0.86), rgba(0, 2, 5, 0.66));
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 12px;
      font-size: 12px;
    }

    .score .kills {
      text-align: center;
      font-weight: 700;
    }

    .score .blue {
      color: #2293ff;
    }

    .score .red {
      color: #ff553e;
    }

    .score small {
      font-size: 10px;
      color: #d6dde6;
    }

    .action-bar {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: min(440px, calc(100vw - 24px));
      height: 90px;
      display: grid;
      grid-template-columns: 70px 1fr 150px;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
    }

    .large-gem {
      width: 58px;
      height: 58px;
      margin: auto;
      position: relative;
      background: linear-gradient(145deg, #0353ff 0%, #081b89 48%, #29a8ff 100%);
      clip-path: polygon(50% 0, 95% 34%, 72% 100%, 28% 100%, 5% 34%);
      box-shadow: 0 0 24px rgba(0, 93, 255, 0.75);
    }

    .large-gem::after {
      content: "4";
      position: absolute;
      right: 4px;
      bottom: 0;
      font-size: 11px;
      color: #fff;
    }

    .ability-wrap {
      min-width: 0;
    }

    .abilities {
      display: grid;
      grid-template-columns: repeat(4, 38px) 34px 34px 34px;
      gap: 4px;
      align-items: end;
      margin-bottom: 5px;
    }

    .slot {
      height: 38px;
      border: 1px solid rgba(121, 134, 126, 0.28);
      background:
        radial-gradient(circle at 35% 30%, rgba(78, 199, 255, 0.82), transparent 22%),
        linear-gradient(135deg, rgba(13, 48, 126, 0.96), rgba(4, 9, 22, 0.96));
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .slot.dark {
      background: rgba(4, 8, 11, 0.88);
    }

    .slot.potion {
      background:
        radial-gradient(circle at 48% 62%, rgba(56, 164, 255, 0.9) 0 18%, transparent 20%),
        linear-gradient(180deg, #7a5124, #12100e);
    }

    .slot::before {
      content: "";
      position: absolute;
      inset: 6px;
      background: linear-gradient(135deg, transparent 20%, rgba(71, 197, 255, 0.7) 22% 35%, transparent 37%),
        linear-gradient(45deg, transparent 28%, rgba(26, 57, 240, 0.9) 30% 58%, transparent 60%);
      filter: drop-shadow(0 0 7px #1683ff);
    }

    .slot.dark::before,
    .slot.potion::before {
      display: none;
    }

    .slot b,
    .slot em {
      position: absolute;
      font-style: normal;
      font-size: 10px;
      line-height: 1;
    }

    .slot b {
      top: 2px;
      right: 4px;
      color: #cceaff;
    }

    .slot em {
      left: 50%;
      bottom: 2px;
      transform: translateX(-50%);
      color: #e8edf6;
    }

    .thin-bars {
      display: grid;
      gap: 2px;
    }

    .thin-bars .bar {
      height: 10px;
      font-size: 9px;
    }

    .gold-box {
      height: 27px;
      display: grid;
      place-items: center;
      color: #ffd26a;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(121, 134, 126, 0.2);
      border-radius: 2px;
    }

    .minimap {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: min(220px, 31vw);
      min-width: 168px;
    }

    .tabs {
      height: 29px;
      width: 140px;
      margin-left: 45px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(188, 169, 111, 0.18);
      border-bottom: 0;
      background: rgba(4, 8, 12, 0.86);
    }

    .tab {
      display: grid;
      place-items: center;
      color: #aab4bd;
      font-size: 14px;
      border-right: 1px solid rgba(188, 169, 111, 0.13);
    }

    .tab:last-child {
      border-right: 0;
      color: #b53cff;
    }

    .map {
      position: relative;
      aspect-ratio: 1.42;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(188, 169, 111, 0.22);
      background:
        radial-gradient(circle at 50% 53%, rgba(104, 33, 175, 0.65) 0 8%, transparent 9%),
        linear-gradient(135deg, transparent 44%, rgba(84, 66, 44, 0.72) 45% 55%, transparent 56%),
        linear-gradient(45deg, transparent 44%, rgba(84, 66, 44, 0.72) 45% 55%, transparent 56%),
        radial-gradient(circle at 24% 27%, rgba(34, 95, 155, 0.55), transparent 20%),
        radial-gradient(circle at 76% 76%, rgba(143, 36, 39, 0.55), transparent 20%),
        #172319;
      box-shadow: inset 0 0 18px #020506, 0 0 18px rgba(0, 0, 0, 0.55);
    }

    .map::before,
    .map::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 10px solid rgba(15, 24, 18, 0.8);
      border-left-color: rgba(44, 64, 54, 0.7);
      border-right-color: rgba(44, 36, 30, 0.7);
      transform: rotate(-18deg);
      border-radius: 45%;
    }

    .map::after {
      inset: 21%;
      border-width: 7px;
      transform: rotate(18deg);
      opacity: 0.72;
    }

    .marker {
      position: absolute;
      width: 9px;
      height: 9px;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 9px currentColor;
      z-index: 2;
    }

    .marker.blue {
      color: #1683ff;
      background: #1683ff;
    }

    .marker.red {
      color: #ff4437;
      background: #ff4437;
    }

    .marker.purple {
      color: #9b35ff;
      background: #9b35ff;
    }

    .viewport {
      position: absolute;
      left: 48%;
      bottom: 19%;
      width: 25%;
      height: 24%;
      border: 2px solid rgba(231, 241, 255, 0.82);
      z-index: 3;
    }

    @media (max-width: 880px) {
      .minimap {
        display: none;
      }
    }

    @media (max-width: 740px) {
      .top-left {
        transform: scale(0.82);
        transform-origin: top left;
      }

      .score {
        transform: scale(0.86);
        transform-origin: top right;
      }

      .action-bar {
        width: min(390px, calc(100vw - 12px));
        grid-template-columns: 58px 1fr 118px;
        gap: 6px;
      }

      .abilities {
        grid-template-columns: repeat(4, 34px) 30px 30px;
      }

      .slot {
        height: 34px;
      }

      .abilities .slot:nth-last-child(1) {
        display: none;
      }

    }
  </style>
</head>
<body>
  <canvas class="webgl" aria-label="A dark isometric crystal lane battle scene"></canvas>
  <div class="vignette"></div>
  <main class="hud" aria-hidden="true">
    <section class="top-left panel">
      <div class="portrait"></div>
      <div class="hero-card">
        <div class="bars">
          <div class="bar health"><i></i><span>876 / 876</span></div>
          <div class="bar mana"><i></i><span>420 / 420</span></div>
        </div>
        <div class="stats">
          <div class="stat">ATK 62</div>
          <div class="stat">SPD 35</div>
          <div class="stat"></div>
          <div class="stat">ARM 0.73</div>
          <div class="stat">PWR 30</div>
          <div class="stat"></div>
          <div class="stat">MOV 340</div>
          <div class="coin-row"><span class="coin"></span>210</div>
        </div>
      </div>
    </section>

    <section class="score">
      <div class="kills"><span class="blue">2</span> <small>vs</small> <span class="red">1</span></div>
      <div>04:27</div>
      <small></small>
      <small>FPS: 60&nbsp;&nbsp;&nbsp;&nbsp; 22 ms</small>
    </section>

    <section class="action-bar panel">
      <div class="large-gem"></div>
      <div class="ability-wrap">
        <div class="abilities">
          <div class="slot"><b>50</b><em>Q</em></div>
          <div class="slot"><b>60</b><em>W</em></div>
          <div class="slot"><b>70</b><em>E</em></div>
          <div class="slot"><b>100</b><em>R</em></div>
          <div class="slot potion"><em>1</em></div>
          <div class="slot dark"></div>
          <div class="slot dark"></div>
        </div>
        <div class="thin-bars">
          <div class="bar health"><i></i><span>876 / 876</span></div>
          <div class="bar mana"><i></i><span>420 / 420</span></div>
        </div>
      </div>
      <div class="gold-box"><span><span class="coin"></span>210</span></div>
    </section>

    <section class="minimap">
      <div class="tabs">
        <div class="tab">X</div>
        <div class="tab">D</div>
        <div class="tab">V</div>
      </div>
      <div class="map panel">
        <i class="marker red" style="left: 11%; top: 16%"></i>
        <i class="marker red" style="left: 95%; top: 17%"></i>
        <i class="marker red" style="left: 90%; top: 80%"></i>
        <i class="marker blue" style="left: 8%; top: 82%"></i>
        <i class="marker blue" style="left: 12%; top: 61%"></i>
        <i class="marker blue" style="left: 36%; top: 76%"></i>
        <i class="marker purple" style="left: 51%; top: 51%"></i>
        <i class="marker red" style="left: 63%; top: 26%"></i>
        <i class="marker red" style="left: 72%; top: 27%"></i>
        <i class="marker red" style="left: 80%; top: 30%"></i>
        <div class="viewport"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const canvas = document.querySelector(".webgl");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.74;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07101b);
    scene.fog = new THREE.FogExp2(0x081423, 0.012);

    const camera = new THREE.OrthographicCamera();
    camera.position.set(0, 17.2, 14.8);
    camera.lookAt(0, 0, 0);
    camera.zoom = 0.92;
    scene.add(camera);

    const clock = new THREE.Clock();
    const laneGroup = new THREE.Group();
    const forestGroup = new THREE.Group();
    const unitsGroup = new THREE.Group();
    const glowSprites = [];
    const billboards = [];
    scene.add(laneGroup, forestGroup, unitsGroup);

    const mats = {
      laneA: new THREE.MeshStandardMaterial({ color: 0x344259, roughness: 0.94, metalness: 0.02 }),
      laneB: new THREE.MeshStandardMaterial({ color: 0x26364e, roughness: 0.96, metalness: 0.02 }),
      laneC: new THREE.MeshStandardMaterial({ color: 0x405069, roughness: 0.92, metalness: 0.02 }),
      dirt: new THREE.MeshStandardMaterial({ color: 0x0b1119, roughness: 1 }),
      grass: new THREE.MeshStandardMaterial({ color: 0x21382c, roughness: 1 }),
      moss: new THREE.MeshBasicMaterial({ color: 0x253d2b, transparent: true, opacity: 0.3, depthWrite: false }),
      wall: new THREE.MeshStandardMaterial({ color: 0x344056, roughness: 0.88 }),
      wallDark: new THREE.MeshStandardMaterial({ color: 0x202b3b, roughness: 0.94 }),
      trunk: new THREE.MeshStandardMaterial({ color: 0x2c1834, roughness: 0.88 }),
      root: new THREE.MeshStandardMaterial({ color: 0x4c2445, roughness: 0.9 }),
      rootDark: new THREE.MeshStandardMaterial({ color: 0x1b1425, roughness: 0.94 }),
      foregroundRock: new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.98 }),
      leaf: new THREE.MeshStandardMaterial({ color: 0x10241f, roughness: 1 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x29314a, roughness: 0.95 }),
      blue: new THREE.MeshStandardMaterial({ color: 0x0b55ff, emissive: 0x0739e6, emissiveIntensity: 1.65, roughness: 0.36 }),
      red: new THREE.MeshStandardMaterial({ color: 0xff382f, emissive: 0xb20a08, emissiveIntensity: 1.45, roughness: 0.38 }),
      magenta: new THREE.MeshStandardMaterial({ color: 0xff38d6, emissive: 0xa500e0, emissiveIntensity: 1.75, roughness: 0.36 }),
      teal: new THREE.MeshStandardMaterial({ color: 0x17f1be, emissive: 0x06b08e, emissiveIntensity: 1.55, roughness: 0.38 }),
      black: new THREE.MeshBasicMaterial({ color: 0x010306 }),
      hpGreen: new THREE.MeshBasicMaterial({ color: 0x25e53d }),
      hpRed: new THREE.MeshBasicMaterial({ color: 0xf93827 }),
      hpBlue: new THREE.MeshBasicMaterial({ color: 0x1e95ff })
    };

    function rand(seed) {
      const x = Math.sin(seed * 999.123) * 43758.5453;
      return x - Math.floor(x);
    }

    function makeGlowTexture() {
      const size = 128;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(0.22, "rgba(120,190,255,0.92)");
      grad.addColorStop(0.55, "rgba(42,110,255,0.28)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeTextTexture(text, fg = "#ffffff", bg = "#020508") {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 64;
      const g = c.getContext("2d");
      g.fillStyle = bg;
      g.fillRect(16, 14, 64, 36);
      g.strokeStyle = "rgba(190,210,230,.55)";
      g.strokeRect(16.5, 14.5, 63, 35);
      g.font = "bold 28px Trebuchet MS, Arial";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillStyle = fg;
      g.fillText(text, 48, 33);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const glowTexture = makeGlowTexture();
    const textureLoader = new THREE.TextureLoader();

    function loadRoadTexture(name, repeatX = 1, repeatY = 1, mirror = false) {
      const tex = textureLoader.load(`assets/moonlit-road/${name}`);
      tex.colorSpace = THREE.SRGBColorSpace;
      const wrap = mirror ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping;
      tex.wrapS = repeatX === 1 ? THREE.ClampToEdgeWrapping : wrap;
      tex.wrapT = repeatY === 1 ? THREE.ClampToEdgeWrapping : wrap;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    function addGlow(parent, color, size, position, opacity = 0.85) {
      const mat = new THREE.SpriteMaterial({
        map: glowTexture,
        color,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const sprite = new THREE.Sprite(mat);
      sprite.position.copy(position);
      sprite.scale.set(size, size, size);
      sprite.userData.baseSize = size;
      parent.add(sprite);
      glowSprites.push(sprite);
      return sprite;
    }

    function makeCobbleTexture() {
      const c = document.createElement("canvas");
      c.width = 2048;
      c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#1f2d43";
      g.fillRect(0, 0, c.width, c.height);

      const colors = ["#263752", "#2b3e5c", "#22324c", "#31445f", "#1d2b43"];
      let id = 0;
      for (let y = -18; y < c.height + 34; y += 34) {
        const rowOffset = rand(id + 2000) * 42;
        for (let x = -64 + rowOffset; x < c.width + 64; x += 48 + rand(id + 2001) * 26) {
          const w = 38 + rand(id + 2002) * 42;
          const h = 24 + rand(id + 2003) * 22;
          const px = x + (rand(id + 2004) - 0.5) * 12;
          const py = y + (rand(id + 2005) - 0.5) * 9;
          const r = 8 + rand(id + 2006) * 11;
          const fill = colors[Math.floor(rand(id + 2007) * colors.length)];

          const grad = g.createLinearGradient(px, py, px + w, py + h);
          grad.addColorStop(0, fill);
          grad.addColorStop(1, "#18263e");
          g.fillStyle = grad;
          g.strokeStyle = "rgba(4, 10, 20, 0.56)";
          g.lineWidth = 3;
          g.beginPath();
          g.roundRect(px, py, w, h, r);
          g.fill();
          g.stroke();

          g.strokeStyle = "rgba(92, 122, 165, 0.18)";
          g.lineWidth = 1.2;
          g.beginPath();
          g.roundRect(px + 2, py + 2, Math.max(2, w - 5), Math.max(2, h - 5), Math.max(2, r - 3));
          g.stroke();
          id += 1;
        }
      }

      for (let i = 0; i < 900; i++) {
        const x = rand(i + 3000) * c.width;
        const y = rand(i + 4000) * c.height;
        const s = 0.7 + rand(i + 5000) * 2.2;
        g.fillStyle = rand(i + 6000) > 0.55 ? "rgba(79, 103, 139, 0.15)" : "rgba(5, 11, 20, 0.22)";
        g.fillRect(x, y, s, s);
      }

      const vignette = g.createRadialGradient(c.width / 2, c.height / 2, 20, c.width / 2, c.height / 2, c.width * 0.55);
      vignette.addColorStop(0, "rgba(80, 105, 145, 0.08)");
      vignette.addColorStop(1, "rgba(0, 4, 12, 0.24)");
      g.fillStyle = vignette;
      g.fillRect(0, 0, c.width, c.height);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = 8;
      return tex;

    function resizeCamera() {
      const aspect = window.innerWidth / window.innerHeight;
      const base = 12.8;
      camera.left = -base * aspect;
      camera.right = base * aspect;
      camera.top = base;
      camera.bottom = -base;
      camera.near = 0.1;
      camera.far = 80;
      camera.zoom = aspect < 1.25 ? 1.18 : aspect < 1.55 ? 1.04 : 0.92;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function addTwistedBranch(points, radius, material) {
      const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
      const geo = new THREE.TubeGeometry(curve, 22, radius, 7, false);
      const branch = new THREE.Mesh(geo, material);
      branch.castShadow = true;
      branch.receiveShadow = true;
      forestGroup.add(branch);
      return branch;
    }

    function addRootRibbon(points, radius, seed = 0) {
      const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
      const geo = new THREE.TubeGeometry(curve, 28, radius, 6, false);
      const root = new THREE.Mesh(geo, mats.root);
      root.castShadow = true;
      root.receiveShadow = true;
      forestGroup.add(root);

      const shadowCurve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0] + 0.24, Math.max(0.05, p[1] - 0.08), p[2] + 0.28)));
      const shadow = new THREE.Mesh(new THREE.TubeGeometry(shadowCurve, 22, radius * 0.74, 5, false), mats.rootDark);
      shadow.castShadow = false;
      shadow.receiveShadow = true;
      forestGroup.add(shadow);

      for (let i = 1; i < points.length - 1; i++) {
        if (rand(seed + i) < 0.35) continue;
        const p = points[i];
        const dir = rand(seed + i + 10) > 0.5 ? 1 : -1;
        addTwistedBranch([
          [p[0], p[1] + 0.03, p[2]],
          [p[0] + dir * (0.8 + rand(seed + i + 20) * 1.2), p[1] + 0.02, p[2] + 0.25 + rand(seed + i + 30) * 0.55],
          [p[0] + dir * (1.5 + rand(seed + i + 40) * 1.2), p[1], p[2] + 0.5 + rand(seed + i + 50) * 0.8]
        ], radius * 0.42, mats.root);
      }
    }

      addTwistedBranch([
        [x, 0.18, z],

        [x - 0.15 * scale, 1.72 * scale, z + 0.1 * scale],
        [x + 0.32 * scale, 2.5 * scale, z - 0.28 * scale]
      ], 0.18 * scale, mat);
      addTwistedBranch([
        [x + 0.05 * scale, 1.15 * scale, z],
        [x - 0.62 * scale, 1.65 * scale, z + 0.24 * scale],
        [x - 1.1 * scale, 2.15 * scale, z + 0.18 * scale]
      ], 0.09 * scale, mat);
      addTwistedBranch([
        [x + 0.12 * scale, 1.4 * scale, z],
        [x + 0.72 * scale, 1.95 * scale, z - 0.18 * scale],
        [x + 1.2 * scale, 2.45 * scale, z - 0.05 * scale]
      ], 0.08 * scale, mat);
      addTwistedBranch([
        [x, 0.25, z],
        [x - 0.9 * scale, 0.25, z + 0.28 * scale],
        [x - 1.65 * scale, 0.22, z + 0.12 * scale]
      ], 0.12 * scale, mat);
      addTwistedBranch([
        [x + 0.05 * scale, 0.26, z],
        [x + 0.92 * scale, 0.2, z - 0.34 * scale],
        [x + 1.72 * scale, 0.2, z - 0.12 * scale]
      ], 0.12 * scale, mat);

      if (!foreground) {

      forestGroup.add(light);
    }

    function addCrystal(x, z, material, color, scale = 1) {
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.42 * scale, 0), material);
      crystal.position.set(x, 0.7 * scale, z);
      crystal.scale.set(0.82, 1.45, 0.82);
      crystal.castShadow = true;
      crystal.userData.floatBase = crystal.position.y;
      crystal.userData.floatSpeed = 1.1 + rand(x + z) * 0.6;
      unitsGroup.add(crystal);
      addGlow(unitsGroup, color, 1.25 * scale, new THREE.Vector3(x, 0.72 * scale, z), 0.5);
      return crystal;
    }

    function makeHealthBar(width, colorMat, level = "") {
      const g = new THREE.Group();
      const back = new THREE.Mesh(new THREE.PlaneGeometry(width + 0.1, 0.18), mats.black);
      back.position.set(0, 0, 0);
      const fill = new THREE.Mesh(new THREE.PlaneGeometry(width, 0.1), colorMat);
      fill.position.set(0, 0.01, 0.01);
      g.add(back, fill);
      if (level) {
        const tex = makeTextTexture(level);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
        const text = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.35), mat);
        text.position.set(-(width / 2) - 0.42, 0.02, 0.02);
        g.add(text);
      }
      billboards.push(g);
      return g;
    }

    function addMinion(x, z, team = "blue", type = "small") {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      const isBlue = team === "blue";
      const material = isBlue ? mats.blue : mats.red;
      const color = isBlue ? 0x1683ff : 0xff3b30;
      const size = type === "hero" ? 1.25 : 0.68;

      const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.45 * size, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.36, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.04;
      group.add(shadow);

      const body = new THREE.Mesh(new THREE.ConeGeometry(0.28 * size, 0.75 * size, 4), material);
      body.position.y = 0.45 * size;
      body.rotation.y = Math.PI / 4;
      body.castShadow = true;
      group.add(body);

      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.22 * size, 0), material);
      gem.position.y = 0.98 * size;
      gem.scale.y = 1.45;
      gem.castShadow = true;
      group.add(gem);

      if (type === "hero") {
        const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.1, 8), material);
        staff.position.set(isBlue ? 0.35 : -0.35, 0.48, 0);
        staff.rotation.z = isBlue ? -0.8 : 0.8;
        staff.castShadow = true;
        group.add(staff);
        addGlow(group, color, 1.5, new THREE.Vector3(0, 0.95, 0), 0.58);
        const hb = makeHealthBar(1.12, isBlue ? mats.hpGreen : mats.hpRed, "4");
        hb.position.set(0.28, 1.9, 0);
        group.add(hb);
      } else {
        const hb = makeHealthBar(0.58, isBlue ? mats.hpBlue : mats.hpRed);
        hb.position.set(0, 1.1, 0);
        group.add(hb);
      }

      group.userData.sway = rand(x + z) * 10;
      unitsGroup.add(group);
      return group;
    }

    function addTower(x, z) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x303343, roughness: 0.78, metalness: 0.04 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x171a23, roughness: 0.86 });

      const tiers = [
        [1.15, 0.3, 0.18],
        [0.94, 0.28, 0.47],
        [0.72, 0.36, 0.78],
        [0.52, 0.96, 1.22]
      ];
      tiers.forEach(([r, h, y], i) => {
        const tier = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.92, h, 8), i % 2 ? darkMat : baseMat);
        tier.position.y = y;
        tier.rotation.y = Math.PI / 8;
        tier.castShadow = true;
        tier.receiveShadow = true;
        group.add(tier);
      });

      const crown = new THREE.Mesh(new THREE.BoxGeometry(1.18, 0.32, 1.18), baseMat);
      crown.position.y = 1.92;
      crown.rotation.y = Math.PI / 4;
      crown.castShadow = true;
      group.add(crown);

      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.43, 0), mats.red);
      crystal.position.y = 2.55;
      crystal.scale.set(0.82, 1.5, 0.82);
      crystal.castShadow = true;
      group.add(crystal);
      addGlow(group, 0xff2e22, 2.25, new THREE.Vector3(0, 2.5, 0), 0.72);

      const hb = makeHealthBar(1.48, mats.hpRed);
      hb.position.set(0.05, 3.28, 0);
      group.add(hb);

      const light = new THREE.PointLight(0xff2e22, 2.1, 6);
      light.position.set(0, 2.6, 0);
      group.add(light);
      unitsGroup.add(group);
      return group;
    }

    function addProjectile() {
      const group = new THREE.Group();
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 18, 12), new THREE.MeshBasicMaterial({ color: 0x5bbcff }));
      group.add(orb);
      addGlow(group, 0x1683ff, 1.55, new THREE.Vector3(0, 0, 0), 0.95);

      const trailMat = new THREE.MeshBasicMaterial({ color: 0x1683ff, transparent: true, opacity: 0.28, depthWrite: false, blending: THREE.AdditiveBlending });
      const trail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 2.4, 16), trailMat);
      trail.rotation.z = Math.PI / 2;
      trail.position.x = -0.95;
      group.add(trail);

      unitsGroup.add(group);
      group.userData.projectile = true;
      return group;
    }

    function addLighting() {
      const hemi = new THREE.HemisphereLight(0x415e8d, 0x06100d, 1.48);
      scene.add(hemi);

      const moon = new THREE.DirectionalLight(0x83a2e4, 2.72);
      moon.position.set(-6, 14, 7);
      moon.castShadow = true;
      moon.shadow.mapSize.set(2048, 2048);
      moon.shadow.camera.left = -24;
      moon.shadow.camera.right = 24;
      moon.shadow.camera.top = 16;
      moon.shadow.camera.bottom = -16;
      moon.shadow.camera.near = 2;
      moon.shadow.camera.far = 38;
      scene.add(moon);

      const fill = new THREE.DirectionalLight(0x4b2c78, 1.08);
      fill.position.set(8, 7, -7);
      scene.add(fill);
    }

    addLighting();
    addGround();
    addForest();
    addCrystalShrine(-15.3, -4.55, 0x13ffc7, mats.teal);
    addCrystalShrine(1.7, -4.55, 0x13ffc7, mats.teal);
    addCrystalShrine(16.6, -4.6, 0xa23cff, mats.magenta);

    const blueHero = addMinion(-5.25, 0.15, "blue", "hero");
    addCrystal(-5.25, 0.15, mats.blue, 0x1683ff, 0.94);
    addMinion(-17.2, 0.35, "blue", "small");
    addMinion(-14, 0.28, "blue", "small");
    addMinion(-11.1, 0.2, "blue", "small");

    const tower = addTower(4.6, 0.15);
    addMinion(8.3, 0.55, "red", "small");
    addMinion(10, 0.1, "red", "small");
    const redHero = addMinion(12.6, 0.35, "red", "hero");
    redHero.children.forEach((child) => {
      if (child.material === mats.red) child.material = mats.magenta;
    });

    const projectile = addProjectile();

    for (let i = 0; i < 22; i++) {
      const x = -23 + rand(i + 200) * 46;
      const z = (rand(i + 201) > 0.5 ? 1 : -1) * (5.3 + rand(i + 202) * 4.4);
      const material = rand(i + 203) > 0.55 ? mats.magenta : mats.blue;
      const color = material === mats.magenta ? 0x7f24ff : 0x1456ff;
      const s = 0.35 + rand(i + 204) * 0.48;
      const gem = addCrystal(x, z, material, color, s);
      gem.rotation.y = rand(i + 205) * Math.PI;
      gem.material = gem.material.clone();
      gem.material.emissiveIntensity = 0.55 + rand(i + 206) * 0.7;
    }

    function updateProjectile(t) {
      const phase = (t * 0.34) % 1;
      const start = new THREE.Vector3(-3.75, 1.08, 0.05);
      const end = new THREE.Vector3(1.5, 1.33, 0.05);
      projectile.position.lerpVectors(start, end, phase);
      projectile.rotation.y = t * 4;
      projectile.scale.setScalar(0.9 + Math.sin(t * 8) * 0.08);
    }

    function animate() {
      const t = clock.getElapsedTime();
      updateProjectile(t);

      unitsGroup.traverse((obj) => {
        if (obj.geometry && obj.geometry.type === "OctahedronGeometry" && obj.userData.floatBase) {
          obj.position.y = obj.userData.floatBase + Math.sin(t * obj.userData.floatSpeed) * 0.05;
          obj.rotation.y += 0.012;
        }
      });

      [blueHero, redHero].forEach((unit, i) => {
        unit.position.y = Math.sin(t * 2.4 + i) * 0.025;
        unit.rotation.y = Math.sin(t * 1.3 + i) * 0.04;
      });

      tower.rotation.y = Math.sin(t * 0.6) * 0.02;

      glowSprites.forEach((sprite, i) => {
        const pulse = 1 + Math.sin(t * (1.8 + (i % 5) * 0.13) + i) * 0.09;
        const base = sprite.userData.baseSize || 1;
        sprite.scale.set(base * pulse, base * pulse, base * pulse);
      });

      billboards.forEach((bar) => {
        bar.lookAt(camera.position);
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCamera);
    resizeCamera();
    animate();
  </script>
</body>
</html>

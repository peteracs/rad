name: Soundness

# D2 — the soundness gate. Every decode path that accepts bytes from outside
# the process (radpack envelopes, fork/delta/save codecs, merge of decoded
# forks) is fuzzed structure-aware: mutants are re-sealed with correct
# digests so they reach the parser and semantic layers behind the integrity
# check. The contract: malformed input is an Err, never a panic, never UB.
#
# Two layers:
#   - fuzz-gate: every push/PR, moderate budget (~100k cases, minutes).
#   - asan-soak: nightly cron + manual, AddressSanitizer build with a deep
#     budget. ASAN (not Miri) because the zstd envelope crosses a C FFI
#     boundary that Miri cannot execute — ASAN watches exactly that seam.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *" # nightly soak
  workflow_dispatch:
    inputs:
      iters:
        description: "RAD_FUZZ_ITERS (mutants per corpus payload)"
        default: "20000"

permissions:
  contents: read

jobs:
  miri-host-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          toolchain: nightly
          components: miri
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}
      - name: Miri public value ownership boundary
        run: cargo +nightly miri test -p rad-vm --test public_value_api --no-default-features
      - name: Miri observational replay capture graph
        run: >-
          cargo +nightly miri test -p rad-vm
          replay_graph_preserves_child_aliases_cycles_and_shared_captures
          --no-default-features -- --nocapture
      - name: Miri checked range boundary
        run: >-
          cargo +nightly miri test -p rad-vm
          boundary_ranges_are_finite_and_exact
          --no-default-features -- --nocapture
      - name: Miri replay execution role
        run: >-
          cargo +nightly miri test -p rad-vm
          failed_attempt_replay_preserves_main_timeline_emit_after_semantics
          --no-default-features -- --nocapture

  fuzz-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-soundness-${{ hashFiles('Cargo.lock') }}
      - name: Fuzz decode paths, tapes, merge, GC pressure
        env:
          RAD_FUZZ_ITERS: "2000"
        run: cargo test -p rad-vm --release fuzz_ -- --nocapture
      - name: Release-mode checked range and replay boundary
        run: |
          timeout 60s cargo test -p rad-vm --release \
            range_plan::tests -- --nocapture
          cargo test -p rad-vm --release \
            failed_attempt_replay_preserves_main_timeline_emit_after_semantics \
            -- --nocapture
      - name: Upload findings (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-findings
          path: /tmp/rad_fuzz_findings/
          if-no-files-found: ignore

  asan-soak:
    # Sanitizers need nightly + -Z flags; soak budget only on cron/manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          toolchain: nightly
          components: rust-src
      # cc >= 1.10 forwards -Zsanitizer=address to the C it builds as
      # -fsanitize=address (cc src/lib.rs, CARGO_CFG_SANITIZE). That C must
      # come from a clang on rustc's own LLVM major: GCC 13-instrumented zstd
      # under rustc's LLVM 23 ASan runtime gave a bogus "stack-use-after-scope"
      # on a zstd global (GH 0001: red with GCC 13, green with clang 23, same
      # nightly and source). blake3, ring and wasmtime also build C via cc
      # (cargo tree -i cc); the net step below checks all of them.
      - name: C compiler on rustc's LLVM
        run: |
          llvm_major=$(rustc +nightly -Vv | sed -n 's/^LLVM version: \([0-9]*\)\..*/\1/p')
          test -n "$llvm_major" || { echo "::error::no LLVM version in rustc -Vv"; exit 1; }
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          base="https://apt.llvm.org/$codename"
          suite="llvm-toolchain-$codename-$llvm_major"
          # a nightly on LLVM's development branch has no versioned suite yet
          curl -fsI "$base/dists/$suite/Release" > /dev/null || suite="llvm-toolchain-$codename"
          # key pinned to the fingerprint apt.llvm.org publishes
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          fpr=$(gpg --show-keys --with-colons llvm.asc | awk -F: '/^fpr/ { print $10; exit }')
          test "$fpr" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421 || {
            echo "::error::apt.llvm.org key fingerprint is '$fpr'"; exit 1; }
          sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm.gpg < llvm.asc
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] $base/ $suite main" |
            sudo tee /etc/apt/sources.list.d/apt-llvm.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends "clang-$llvm_major"
          clang_major=$("clang-$llvm_major" -dumpversion | cut -d. -f1)
          test "$clang_major" = "$llvm_major" || {
            echo "::error::clang-$llvm_major reports $clang_major; rustc uses LLVM $llvm_major"; exit 1; }
          echo "CC=clang-$llvm_major" >> "$GITHUB_ENV"
          echo "CXX=clang++-$llvm_major" >> "$GITHUB_ENV"
          echo "LLVM_MAJOR=$llvm_major" >> "$GITHUB_ENV"
      - name: Fuzz under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0" # the GC owns liveness; leaks are not UB
          RAD_FUZZ_ITERS: ${{ github.event.inputs.iters || '20000' }}
        run: |
          cargo +nightly test -p rad-vm --release fuzz_ \
            -Zbuild-std --target x86_64-unknown-linux-gnu -- --nocapture
      # The net: the FFI seam this job exists for must really be instrumented,
      # and every C archive built for the target must come from the matching
      # clang, not GCC. Fails if cc stops forwarding the flag or another
      # compiler slips in (GH 0001). Checked on the 0001 trees: GCC-built
      # fails, uninstrumented fails, clang-23-built passes.
      - name: C is ASan-instrumented by the matching clang
        if: always()
        run: |
          build=target/x86_64-unknown-linux-gnu/release/build
          zstd=$(find "$build" -path '*zstd-sys*' -name libzstd.a | head -n1)
          test -n "$zstd" || { echo "::error::libzstd.a not found under $build"; exit 1; }
          refs=$(nm "$zstd" | grep -c ' U __asan_' || true)
          echo "$zstd: $refs __asan_ refs"
          test "$refs" -gt 0 || { echo "::error::zstd C is not ASan-instrumented"; exit 1; }
          strings -a "$zstd" | grep -q "clang version $LLVM_MAJOR\." || {
            echo "::error::no object in $zstd is from clang $LLVM_MAJOR"; exit 1; }
          gcc_built=$(find "$build" -name '*.a' -exec sh -c 'strings -a "$1" | grep -q "GCC: (" && echo "$1"' _ {} \;)
          test -z "$gcc_built" || { echo "::error::GCC-built C under ASan:"; echo "$gcc_built"; exit 1; }
      - name: Codec + merge suites under ASAN
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          for filter in composition radpack merge; do
            cargo +nightly test -p rad-vm --release \
              -Zbuild-std --target x86_64-unknown-linux-gnu \
              "$filter" -- --nocapture
          done
          cargo +nightly test -p rad-vm --release \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            replay_graph_preserves_child_aliases_cycles_and_shared_captures \
            -- --nocapture
          cargo +nightly test -p rad-vm --release \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            range_plan::tests -- --nocapture
          cargo +nightly test -p rad-vm --release \
            -Zbuild-std --target x86_64-unknown-linux-gnu \
            failed_attempt_replay_preserves_main_timeline_emit_after_semantics \
            -- --nocapture
      - name: Upload findings (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-fuzz-findings
          path: /tmp/rad_fuzz_findings/
          if-no-files-found: ignore

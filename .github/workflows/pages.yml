name: Deploy Playground and Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/vm/src/**'
      - 'core/vm/Cargo.toml'
      - 'core/vm/Cargo.lock'
      - 'projects/playground/**'
      - 'adapters/webgpu/**'
      - 'adapters/cli/src/cli/arguments.rs'
      - 'docs/**'
      - 'projects/dogfood/sovereign-grid/**'
      - 'tooling/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_BUILD_JOBS: 1

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM
        run: wasm-pack build --target web core/vm/

      - name: Verify generated language and API references
        run: |
          cargo build -p rad-cli -p rad-ffi-worker -j 1
          python3 tooling/language_surface.py --check
          python3 tooling/host_api_surface.py --check
          python3 tooling/generate_language_coverage.py --rad target/debug/rad --check
          python3 tooling/check_language_surface.py --rad target/debug/rad
          python3 tooling/check_rad_doc_examples.py --rad target/debug/rad

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/webgpu/package-lock.json

      - name: Build WebGPU dogfood
        run: |
          npm ci --prefix adapters/webgpu
          npm run build --prefix adapters/webgpu

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked

      - name: Build documentation
        run: mdbook build docs

      - name: Build Rust embedding documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps -j 1

      - name: Prepare site
        run: |
          mkdir -p _site
          cp projects/playground/index.html _site/
          cp -r core/vm/pkg _site/pkg
          cp -r adapters/webgpu/demo-dist _site/webgpu
          cp -r docs/book _site/docs
          cp -r target/doc _site/rustdoc
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

name: Benchmarks

on:
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'core/vm/src/**'
      - 'core/vm/benches/**'
      - 'core/vm/Cargo.toml'
      - 'benches/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'core/vm/src/**'
      - 'core/vm/benches/**'
      - 'core/vm/Cargo.toml'
      - 'benches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criterion-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('Cargo.lock') }}

      - name: Run Criterion benchmarks
        run: cargo bench -p rad-vm --bench rad_benchmarks -- --output-format bencher 2>&1 | tee core/vm/bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-report
          path: |
            target/criterion/
            core/vm/bench-output.txt
          retention-days: 30

  profile-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Build Rust VM (debug + release)
        run: |
          cargo build -p rad-vm --quiet
          cargo build -p rad-vm --release --quiet

      - name: Run debug vs release comparison
        run: python benches/compare.py --runs 5 | tee bench-compare.txt

      - name: Upload comparison results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-comparison
          path: bench-compare.txt
          retention-days: 30

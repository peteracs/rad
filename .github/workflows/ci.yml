name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Audit Rust lockfiles
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
          cargo audit --deny warnings --file projects/moba-rad/server/edge-proxy/Cargo.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Audit Node lockfiles
        run: |
          npm audit --package-lock-only --ignore-scripts --audit-level=high --prefix benches/baselines/collab
          npm audit --package-lock-only --ignore-scripts --audit-level=high --prefix projects/playground/relay
          npm audit --package-lock-only --ignore-scripts --audit-level=high --prefix projects/moba-rad/server
          npm audit --package-lock-only --ignore-scripts --audit-level=high --prefix projects/moba-rad/client
          npm audit --package-lock-only --ignore-scripts --audit-level=high --prefix projects/rad-webgpu

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test -p rad-vm --verbose
      - name: Playground smoke (WASM compile_and_run)
        run: cargo test -p rad-vm compile_and_run_playground --verbose
      - name: Project-owned native math kernels
        run: |
          cargo test --manifest-path projects/dogfood/native-math-kernels/Cargo.toml
          sh projects/dogfood/native-math-kernels/build.sh release
      - name: Mathematical dogfoods do not leak into the VM kernel
        run: |
          if grep -rEi 'collatz|frankl|union.?closed|hailstone|3n.?\+.?1' core --include='*.rs' --include='*.rad'; then
            echo "Problem-specific mathematics belongs in project extensions, not core/." >&2
            exit 1
          fi
      - name: Frankl computational-mathematics dogfood
        run: |
          python3 -m pip install --requirement projects/dogfood/frankl-search/requirements.txt
          cargo run -p rad-vm --bin rad -- projects/dogfood/frankl-search/exhaustive_n4.rad
          cargo run -p rad-vm --bin rad -- projects/dogfood/frankl-search/search.rad --experimental-laws --record projects/dogfood/frankl-search/out/ci.radr -- 1 4 2 1 24 quick
          target/debug/rad replay projects/dogfood/frankl-search/out/ci.radr
          python3 -m unittest discover -s projects/dogfood/frankl-search -p 'test_*.py' -v
          python3 projects/dogfood/frankl-search/verify_certificate.py projects/dogfood/frankl-search/out/latest.json
          python3 -O projects/dogfood/frankl-search/verify_certificate.py projects/dogfood/frankl-search/out/latest.json
          cargo run -p rad-vm --bin rad -- projects/dogfood/frankl-search/cyclic_universes.rad --experimental-laws
          python3 projects/dogfood/frankl-search/verify_structure.py projects/dogfood/frankl-search/out/cyclic-universes.json --quick
      - name: Collatz structural dogfood
        run: |
          cargo run -p rad-vm --bin rad -- projects/dogfood/collatz-lab/main.rad --experimental-laws --record projects/dogfood/collatz-lab/out/ci.radr
          target/debug/rad replay projects/dogfood/collatz-lab/out/ci.radr
          python3 projects/dogfood/collatz-lab/verify_certificate.py projects/dogfood/collatz-lab/out/certificate.json --report projects/dogfood/collatz-lab/out/ci-verification.json
          cargo run -p rad-vm --bin rad -- projects/dogfood/collatz-lab/natural_tail.rad --experimental-laws --record projects/dogfood/collatz-lab/out/ci-natural-tail.radr
          target/debug/rad replay projects/dogfood/collatz-lab/out/ci-natural-tail.radr
          python3 projects/dogfood/collatz-lab/verify_natural_tail.py projects/dogfood/collatz-lab/out/natural-tail-certificate.json --report projects/dogfood/collatz-lab/out/ci-natural-tail-verification.json
          cargo run -p rad-vm --bin rad -- projects/dogfood/collatz-lab/support_pressure.rad --experimental-laws --record projects/dogfood/collatz-lab/out/ci-support-pressure.radr -- projects/dogfood/collatz-lab/out/support-pressure-certificate.json 7
          target/debug/rad replay projects/dogfood/collatz-lab/out/ci-support-pressure.radr
          python3 projects/dogfood/collatz-lab/verify_support_pressure.py projects/dogfood/collatz-lab/out/support-pressure-certificate.json --report projects/dogfood/collatz-lab/out/ci-support-pressure-verification.json
          cargo run -p rad-vm --bin rad -- projects/dogfood/collatz-lab/frontier_probe.rad --experimental-laws --record projects/dogfood/collatz-lab/out/ci-frontier.radr -- 1024 14 64 > projects/dogfood/collatz-lab/out/ci-frontier.json
          python3 projects/dogfood/collatz-lab/verify_frontier.py projects/dogfood/collatz-lab/out/ci-frontier.json --output projects/dogfood/collatz-lab/out/ci-frontier-verification.json
          target/debug/rad replay projects/dogfood/collatz-lab/out/ci-frontier.radr

  ordinary-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Run conformance snapshots without experimental features
        run: cargo run -p rad-vm --bin rad -- snapshot tests/conformance
      - name: Run feature snapshots without experimental features
        run: cargo run -p rad-vm --bin rad -- snapshot tests/features

  causal-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Run Causal Laws snapshots with the experimental feature
        run: cargo run -p rad-vm --bin rad -- snapshot --experimental-laws tests/fixtures/causal-laws
      - name: Run Candidate Constraint snapshots with the experimental feature
        run: cargo run -p rad-vm --bin rad -- snapshot --experimental-laws tests/fixtures/causal-constraints
      - name: Verify Causal Laws remain gated without the feature
        run: cargo test -p rad-vm causal_syntax_is_rejected_without_the_experimental_feature --verbose

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Check authoritative VM library for wasm32
        run: cargo check -p rad-vm --lib --target wasm32-unknown-unknown

  rust-compile-examples:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Build rad CLI
        run: cargo build -p rad-vm
      - name: Entry main must declare return type (no bare fn main() {)
        run: |
          if grep -rE "fn\s+main\s*\(\s*\)\s*\{" examples tooling/templates tests/conformance benches --include='*.rad' 2>/dev/null; then
            echo "Bare \`fn main() {\` is forbidden in examples, tooling/templates, conformance, and benches." >&2
            echo "Use \`fn main() -> nil {\` (or another explicit \`-> Type\`). See docs/src/reference/spec.md §7.1.1." >&2
            exit 1
          fi
          echo "OK: no bare implicit return \`fn main()\` in canonical .rad trees."
      - name: Compile examples with Rust VM
        run: |
          for f in examples/*.rad; do
            echo "--- $f ---"
            ./target/debug/rad "$f" || exit 1
          done
      - name: Compile modular examples with Rust VM
        run: |
          for entry in examples/*/main.rad; do
            [ -f "$entry" ] || continue
            echo "--- $entry ---"
            ./target/debug/rad "$entry" || exit 1
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Documentation links resolve
        run: python tooling/scripts/check_doc_links.py
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - name: Build documentation
        run: mdbook build docs

  # The edge proxy sets its own `[workspace]`, so `cargo check --workspace` at
  # the repo root does not reach it. Gate it separately.
  moba-rad-edge-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/moba-rad/server/edge-proxy/target
          key: ${{ runner.os }}-edge-proxy-${{ hashFiles('projects/moba-rad/server/edge-proxy/Cargo.toml') }}
      - name: cargo test
        run: cargo test --manifest-path projects/moba-rad/server/edge-proxy/Cargo.toml

  moba-rad-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build browser runtime
        run: wasm-pack build --target web --out-dir ../../projects/playground/pkg core/vm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/moba-rad/client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/moba-rad/client
      - name: Typecheck and unit tests
        run: npm test
        working-directory: projects/moba-rad/client
      - name: Production build
        run: npm run build
        working-directory: projects/moba-rad/client

  rad-webgpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build browser runtime
        run: wasm-pack build --target web core/vm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/rad-webgpu/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/rad-webgpu
      - name: Typecheck and unit tests
        run: npm test
        working-directory: projects/rad-webgpu
      - name: Build package and dogfood
        run: npm run build
        working-directory: projects/rad-webgpu
      - name: Install browser rendering dependency
        run: npx --no-install playwright install --with-deps --no-shell chromium
        working-directory: projects/rad-webgpu
      - name: WebGPU pixel, resize, restart, and recovery smoke
        run: npm run test:browser
        working-directory: projects/rad-webgpu

  moba-rad-server:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Build rad CLI
        run: cargo build -p rad-vm --bin rad
      - name: RAD authority smoke suites
        run: npm test
        working-directory: projects/moba-rad/server
